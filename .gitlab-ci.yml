workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages: [security, quality, unit, build]

variables:
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

.pnpm_job:
  image: node:24.20.0-bookworm
  interruptible: true
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]
  before_script:
    - corepack enable
    - corepack prepare pnpm@12.3.4 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

security:
  extends: .pnpm_job
  stage: security
  script:
    - pnpm audit --audit-level=moderate
    - pnpm run sbom
  artifacts:
    paths: [sbom.cdx.json]
    expire_in: 1 month

secrets:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - gitleaks git --redact --no-banner .

verified-secrets:
  stage: security
  image:
    name: trufflesecurity/trufflehog:3.97.4
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - trufflehog git file://$CI_PROJECT_DIR --only-verified --fail --no-update

filesystem-security:
  stage: security
  image:
    name: aquasec/trivy:0.74.0
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 --skip-dirs node_modules .

codeql:
  stage: quality
  image: node:24.20.0-bookworm
  interruptible: true
  script:
    - curl --fail --location --retry 3 --max-time 180 https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.26.4/codeql-bundle-linux64.tar.gz --output /tmp/codeql.tar.gz
    - echo "48e1ab8b874d57bd6fd7c90fefee75addc5a45e9bd063982df9beb45a62dd5d3  /tmp/codeql.tar.gz" | sha256sum --check
    - tar -xzf /tmp/codeql.tar.gz -C /tmp
    - /tmp/codeql/codeql database create codeql-db --language=javascript --source-root .
    - /tmp/codeql/codeql database analyze codeql-db javascript-code-scanning.qls --format=sarif-latest --output=codeql-results.sarif
  artifacts:
    when: always
    expire_in: 1 week
    paths: [codeql-results.sarif]

lint:
  extends: .pnpm_job
  stage: quality
  script:
    - pnpm check:ci

typecheck:
  extends: .pnpm_job
  stage: quality
  script: [pnpm typecheck]

unit:
  extends: .pnpm_job
  stage: unit
  script: [pnpm test:coverage]
  artifacts:
    when: always
    expire_in: 1 week
    paths: [coverage/]

build-and-e2e:
  extends: .pnpm_job
  stage: build
  script:
    - pnpm build
    - pnpm exec playwright install --with-deps chromium webkit
    - pnpm test:e2e
  artifacts:
    when: always
    expire_in: 1 week
    paths: [playwright-report/, test-results/]
